services:
  api:
    build: .
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["verity-data:/app/data"]
    restart: unless-stopped
  evaluation:
    build: .
    env_file: .env
    command: ["python", "-m", "workers.evaluation"]
    volumes: ["verity-data:/app/data"]
    depends_on: [api]
    restart: unless-stopped
# Voice/integrity are launched per session with scripts/run.py on the same host.
# A session supervisor and distributed dispatch are explicit next-stage work.
volumes:
  verity-data:
